<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Siswa</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background: linear-gradient(-45deg,
      #ff1493,
      #ff69b4,
      #ff8fd8,
      #ff4fc3);
      background-size:400% 400%;
      animation:bg 10s ease infinite;
    }

    @keyframes bg{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Efek blink neon */
    @keyframes blink{
      0%,100%{
        box-shadow:
        0 0 10px #fff,
        0 0 20px #ff69b4,
        0 0 40px #ff1493;
      }

      50%{
        box-shadow:
        0 0 5px #fff,
        0 0 10px #ff69b4,
        0 0 20px #ff1493;
      }
    }

    .card{
      width:380px;
      padding:30px;
      border-radius:25px;
      text-align:center;
      color:white;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(12px);
      border:2px solid rgba(255,255,255,0.2);
      animation:blink 1.5s infinite;
    }

    .profile-img{
      width:130px;
      height:130px;
      border-radius:50%;
      border:4px solid white;
      object-fit:cover;
      margin-bottom:15px;
    }

    h1{
      font-size:30px;
      margin-bottom:10px;
      color:white;
    }

    .desc{
      font-size:15px;
      line-height:1.7;
      margin-top:10px;
      color:#fff;
    }

    .social{
      margin-top:25px;
    }

    .social a{
      text-decoration:none;
      color:white;
      font-size:28px;
      margin:0 12px;
      transition:0.3s;
    }

    .social a:hover{
      color:#ffe4f2;
      transform:scale(1.2);
    }

    .quote{
      margin-top:20px;
      font-style:italic;
      font-size:14px;
      color:#ffe6f5;
    }

  </style>
</head>

<body>
    <header>
        <h1>Profile Diri Siswa</h1>
    </header>

  <div class="card">

    <!-- Foto -->
    <img src="foto.png"
    alt="Foto Profil"
    class="profile-img">

    <!-- Nama -->
    <h1>Sita Sulistiawati</h1>

    <!-- Deskripsi -->
    <div class="desc">
      <p><b>Kelas:</b> X Informatika</p>
      <p><b>Sekolah:</b> SMKS Kesehatan Yannas Husada Bangkalan</p>
      <p><b>Hobi:</b> Coding dan Desain</p>
    </div>

    <!-- Kata Motivasi -->
    <div class="quote">
      "Menceriakan pengalamannya dengan kreativitas,
      teknologi, dan semangat belajar."
    </div>

    <!-- Media Sosial -->
    <div class="social">

      <!-- Instagram -->
      <a href="#" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>

      <!-- TikTok -->
      <a href="#" title="TikTok">
        <i class="fab fa-tiktok"></i>
      </a>

      <!-- WhatsApp -->
      <a href="#" title="WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>

      <!-- Github -->
      <a href="#" title="Github">
        <i class="fab fa-github"></i>
      </a>

    </div>

  </div>

</body>
</html>
